name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn oracle:build

      - name: build evil-probe slices
        run: npx tsx test/evil/evil-parser-destroyer/build-slices.mjs

      - run: yarn test

      - run: yarn oracle:smoke

      - run: yarn build
