name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run oracle:build

      - name: build evil-probe slices
        run: npx tsx test/evil/evil-parser-destroyer/build-slices.mjs

      - run: npm test

      - run: npm run oracle:smoke

      - run: npm run build
