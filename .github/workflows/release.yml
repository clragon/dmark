name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

env:
  LIB_NAME: dmark
  S3_BUCKET: libs
  S3_ENDPOINT: https://s3.cdn.clynamic.net
  AWS_DEFAULT_REGION: garage
  AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_S3_SECRET_ACCESS_KEY }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run oracle:build

      - name: today utc date
        id: utc_date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: cache e621 db_export dump
        uses: actions/cache@v4
        with:
          path: corpus/db_export
          key: dmark-db-export-${{ hashFiles('scripts/fetch-corpus.ts') }}-${{ steps.utc_date.outputs.value }}
          restore-keys: |
            dmark-db-export-${{ hashFiles('scripts/fetch-corpus.ts') }}-
            dmark-db-export-

      - run: npm run corpus:fetch

      - name: golden tests
        run: npm test -- test/golden-baseline.test.ts test/golden-roundtrip.test.ts

      - name: bump version
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - run: npm run build

      - name: publish to npm registry
        run: |
          npm config set //npm.clynamic.net/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: refuse-overwrite check
        run: |
          existing=$(aws s3api list-objects-v2 \
            --endpoint-url "$S3_ENDPOINT" \
            --bucket "$S3_BUCKET" \
            --prefix "$LIB_NAME/$VERSION/" \
            --max-items 1 \
            --query 'Contents[0].Key' \
            --output text)
          if [ "$existing" != "None" ]; then
            echo "::error::version $LIB_NAME/$VERSION is already populated at key $existing, refusing to overwrite"
            exit 1
          fi

      - name: upload to CDN
        run: |
          set -e
          upload() {
            local file="$1"
            local ct="$2"
            local key="$LIB_NAME/$VERSION/$(basename "$file")"
            aws s3 cp "$file" "s3://$S3_BUCKET/$key" \
              --endpoint-url "$S3_ENDPOINT" \
              --content-type "$ct" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress
          }
          upload dist/dmark.js           "application/javascript; charset=utf-8"
          upload dist/dmark.js.map       "application/json"
          upload dist/dmark.min.js       "application/javascript; charset=utf-8"
          upload dist/dmark.iife.min.js  "application/javascript; charset=utf-8"

      - name: commit version bump
        uses: EndBug/add-and-commit@v9
        with:
          message: "bumped version to ${{ env.VERSION }}"
          default_author: github_actions
          add: package.json

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          files: |
            dist/dmark.js
            dist/dmark.js.map
            dist/dmark.min.js
            dist/dmark.iife.min.js
